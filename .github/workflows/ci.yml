name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx}" "app/**/*.{ts,tsx}" "e2e/**/*.ts" "playwright.config.ts"

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Browser E2E tests
        run: npm run test:e2e
